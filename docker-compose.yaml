version: "3.9"

# Определяем сеть для nginx-proxy
networks:
  nginx-proxy:
    name: nginx-proxy
    driver: bridge

services:
  redis:
    image: redis:latest
    container_name: redis_container
    env_file:
      - .env
    ports:
      - "6380:6379"
    volumes:
      - ./redisdata:/data
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    restart: unless-stopped
    networks:
      - nginx-proxy

  postgres:
    image: postgres:16
    container_name: aq_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - nginx-proxy

  backend:
    container_name: aq_backend
    build:
      context: ./backend
      dockerfile: ./AirQualityMonitoring.Core/Dockerfile
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      Redis__Host: ${REDIS_HOST}
      Redis__User: ${REDIS_USER}
      Redis__Password: ${REDIS_USER_PASSWORD}
      DbConnectionString: ${DB_CONNECTION_STRING}
      # Для nginx-proxy (HTTP only, без SSL)
      VIRTUAL_HOST: aq.ural-net.ru
      VIRTUAL_PORT: 8080
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - nginx-proxy

  k6:
    image: grafana/k6:latest
    container_name: aq_k6
    volumes:
      - ./k6:/scripts
    depends_on:
      - backend
    command: run /scripts/k6-script.js
    networks:
      - nginx-proxy

  # Фронтенд приложение
  map-app:
    image: nginx:latest
    container_name: aq_map_app
    volumes:
      - ./map/index.html:/usr/share/nginx/html/index.html
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - nginx-proxy
    # Если нужно, чтобы map-app тоже был доступен через nginx-proxy, добавьте:
    environment:
      - VIRTUAL_HOST=map.aq.ural-net.ru
      - VIRTUAL_PORT=80

  # Готовый reverse proxy с автоматическим SSL
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: aq_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./ssl:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - nginx-proxy

  # Автоматическое получение SSL сертификатов
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: aq_letsencrypt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ssl:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    environment:
      - NGINX_PROXY_CONTAINER=aq_nginx_proxy
      - DEFAULT_EMAIL=email@aq.ural-net.ru
    depends_on:
      - nginx-proxy
    restart: unless-stopped
    networks:
      - nginx-proxy