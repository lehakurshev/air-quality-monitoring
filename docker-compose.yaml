version: "3.9"

# Определяем сеть для всех сервисов
networks:
  nginx-proxy:
    name: nginx-proxy
    driver: bridge

services:
  redis:
    image: redis:latest
    container_name: redis_container
    env_file:
      - .env
    ports:
      - "6380:6379"
    volumes:
      - ./redisdata:/data
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        redis-server /usr/local/etc/redis/redis.conf
      '
    restart: unless-stopped
    networks:
      - nginx-proxy
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: aq_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aq_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - nginx-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aq_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: aq_backend
    build:
      context: ./backend
      dockerfile: ./AirQualityMonitoring.Core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Используем правильные имена переменных для подключения
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Redis__Host=redis
      - Redis__Port=6379
      - Redis__Password=${REDIS_PASSWORD}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - nginx-proxy
    # Для nginx-proxy
    environment:
      - VIRTUAL_HOST=${DOMAIN:-aq.ural-net.ru}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${DOMAIN:-aq.ural-net.ru}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-email@aq.ural-net.ru}

  k6:
    image: grafana/k6:latest
    container_name: aq_k6
    volumes:
      - ./k6:/scripts
    depends_on:
      - backend
    command: run /scripts/k6-script.js
    networks:
      - nginx-proxy

  # Фронтенд приложение
  map-app:
    image: nginx:latest
    container_name: aq_map_app
    volumes:
      - ./map:/usr/share/nginx/html:ro
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - nginx-proxy
    environment:
      - VIRTUAL_HOST=map.${DOMAIN:-aq.ural-net.ru}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=map.${DOMAIN:-aq.ural-net.ru}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-email@aq.ural-net.ru}

  # Готовый reverse proxy с автоматическим SSL
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: aq_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./ssl:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - nginx-proxy
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

  # Автоматическое получение SSL сертификатов
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: aq_letsencrypt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ssl:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    environment:
      - NGINX_PROXY_CONTAINER=aq_nginx_proxy
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-email@aq.ural-net.ru}
      - DEBUG=false
    depends_on:
      - nginx-proxy
    restart: unless-stopped
    networks:
      - nginx-proxy